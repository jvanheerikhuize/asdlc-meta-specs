name: validate-meta-specs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    # Note: capture PRs are pushed by GITHUB_TOKEN, so GitHub holds this workflow for them and lists an
    # expired, job-less run in the Actions tab. That is expected — ingest-capture validates those PRs and
    # posts the "validate-meta-specs (capture)" status instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: python tools/validate.py --strict
      - run: python tools/project.py --check
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_index.py
