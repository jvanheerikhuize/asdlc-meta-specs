name: "📝 Capture a requirement"
description: "Propose a new requirement. It becomes a reviewed Pull Request — approving the PR is the approval of the requirement."
title: "[capture] "
labels: ["capture"]
body:
  - type: markdown
    attributes:
      value: |
        **Tip:** the guided capture app on GitHub Pages fills this in for you (with hints and a live preview).
        Filling it in here by hand works too — only the first two questions are needed. The issue title becomes the requirement's title (leave it as `[capture]` to derive one).

  - type: textarea
    id: statement
    attributes:
      label: "What should the system do?"
      description: "One sentence in plain language. E.g. *Users can export their profile data as a JSON file.*"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: "Why? What do we know or believe?"
      description: "One reason per line. Each line is recorded as an assumption until someone validates it. (Optional if you list existing facts/assumptions below.)"

  - type: input
    id: refs
    attributes:
      label: "Existing facts or assumptions (optional)"
      description: "IDs that support this requirement, e.g. FCT-0001, ASM-0002"

  - type: textarea
    id: criteria
    attributes:
      label: "How will we know it works? (optional)"
      description: "Given / When / Then lines. Leave a blank line between scenarios. Only *Then* is required."
      placeholder: |
        Given a logged-in user
        When they click "Export"
        Then a JSON file is downloaded

  - type: input
    id: domain
    attributes:
      label: "Domain (optional)"
      description: "Area of the product, e.g. auth, billing. Defaults to 'general'."

  # Plain inputs (not dropdowns) so the capture app can pre-fill them via the URL.
  - type: input
    id: priority
    attributes:
      label: "Priority (optional)"
      description: "p0 critical · p1 high · p2 normal (default) · p3 low"
      placeholder: "p2"

  - type: input
    id: category
    attributes:
      label: "Category (optional)"
      description: "functional (default) · non_functional · security · data · interface"
      placeholder: "functional"

  - type: textarea
    id: notes
    attributes:
      label: "Notes (optional)"
      description: "Anything else reviewers should know."
