# GitHub Spec Kit Projection Mapping Definition
adapter: speckit
version: "1.0.0"
description: "Projects canonical CON, FCT, ASM, QST, SPC, REQ, ACR, and DEC records into GitHub Spec Kit artifacts."

output_root: "dist/speckit"

# Variables available in output_path_pattern / templates.
# Frontmatter fields are referenced by name; the following are DERIVED by the compiler:
derived_variables:
  feature_number: "Numeric part of the SPC id, zero-padded to 3 digits (SPC-0001 -> 001), matching Spec Kit's specs/NNN-feature/ convention"
  "section:<Heading>": "Markdown body content under '## <Heading>'"

projections:
  constitution:
    source_type: "constraint"
    filter: "status == 'active'"
    output_path_pattern: ".specify/memory/constitution.md"
    template: "templates/constitution.md.hbs"

  feature_spec:
    source_type: "spec"
    output_path_pattern: "specs/{{feature_number}}-{{domain}}/spec.md"
    template: "templates/spec.md.hbs"

  technical_plan:
    source_type: "spec"
    output_path_pattern: "specs/{{feature_number}}-{{domain}}/plan.md"
    template: "templates/plan.md.hbs"
