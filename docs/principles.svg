<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" role="img" aria-labelledby="t d">
  <title id="t">Facts → requirements → specs: the five principles</title>
  <desc id="d">A building in cross-section. Facts and assumptions form the foundation, requirements are pillars standing on them, and specs are floors resting on the pillars. A pillar on a fact stands firm, a pillar on an untested assumption is provisional, and a pillar on a refuted assumption is broken. The building is rendered into OpenSpec, Spec Kit and Gherkin, with technology plugged in only at render time.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d1d1b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b8a5a"/>
    </marker>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3d5afe" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3d5afe" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ece6da"/>
      <stop offset="1" stop-color="#f6f2ea"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#7b3fbf" stroke-opacity="0.18" stroke-width="3"/>
    </pattern>
  </defs>

  <style>
    /* Fonts here; colours only as defaults for text without its own fill attribute. */
    text { font-family: "Inter", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
    .sub { font-size: 18px; }
    .lbl { font-size: 14px; font-weight: 700; }
    .small { font-size: 12px; }
    .note { font-size: 13px; }
    .num { font-size: 14px; font-weight: 700; }
    .lt { font-size: 15px; font-weight: 700; }
    .ld { font-size: 13px; }
    text:not([fill]) { fill: #1d1d1b; }
    .sub:not([fill]), .small:not([fill]), .note:not([fill]) { fill: #6b6b66; }
    .ld:not([fill]) { fill: #4a4a45; }
    .white:not([fill]), .num:not([fill]) { fill: #ffffff; }
  </style>

  <!-- card -->
  <rect x="1" y="1" width="1198" height="918" rx="24" fill="#fbfaf7" stroke="#e3e2dd" stroke-width="2"/>

  <!-- header -->
  <text x="60" y="76" class="h1">Facts → requirements → specs</text>
  <text x="60" y="108" class="sub">A spec is never more certain than what it rests on.</text>
  <g transform="translate(60,128)">
    <circle cx="6" cy="6" r="6" fill="#1b8a5a"/><text x="18" y="11" class="note">holds</text>
    <circle cx="74" cy="6" r="6" fill="#fbf0dc" stroke="#c27c0e" stroke-width="2" stroke-dasharray="3 2"/><text x="86" y="11" class="note">not tested yet</text>
    <circle cx="196" cy="6" r="6" fill="#c62828"/><text x="208" y="11" class="note">no longer true</text>
  </g>

  <!-- how to read the picture -->
  <text x="80" y="232" font-size="16" fill="#4a4a45">Read it like a building. Facts and assumptions are the foundation,</text>
  <text x="80" y="256" font-size="16" fill="#4a4a45">requirements are the pillars, and specs are the floors they carry.</text>
  <text x="80" y="280" font-size="16" fill="#4a4a45">A pillar is only as solid as the block it stands on.</text>

  <!-- 2 · atomic record card -->
  <g transform="translate(860,40)">
    <rect width="280" height="132" rx="12" fill="#ffffff" stroke="#e3e2dd" stroke-width="2"/>
    <path d="M0,12 a12,12 0 0 1 12,-12 h256 a12,12 0 0 1 12,12 v20 h-280 z" fill="#f0efeb"/>
    <text x="16" y="22" class="mono" font-size="13" font-weight="700">records/REQ-0001.md</text>
    <text x="16" y="56" class="mono" font-size="13" fill="#6b6b66">---</text>
    <text x="16" y="74" class="mono" font-size="13">id: <tspan fill="#3d5afe">REQ-0001</tspan></text>
    <text x="16" y="92" class="mono" font-size="13">status: <tspan fill="#1b8a5a">active</tspan></text>
    <text x="16" y="110" class="mono" font-size="13">because: [<tspan fill="#1b8a5a">FCT-0001</tspan>]</text>
    <text x="196" y="74" class="small">one file,</text>
    <text x="196" y="92" class="small">one record,</text>
    <text x="196" y="110" class="small">linked by ID</text>
    <circle cx="0" cy="0" r="14" fill="#1d1d1b"/><text x="0" y="5" text-anchor="middle" class="num">2</text>
  </g>

  <!-- 5 · impact arrow up the left side -->
  <line x1="52" y1="696" x2="52" y2="340" stroke="#1b8a5a" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <text transform="translate(38,520) rotate(-90)" text-anchor="middle" class="note" fill="#1b8a5a">a fact changes → rebuild upward, skeleton first</text>

  <!-- ground -->
  <rect x="70" y="640" width="704" height="72" rx="10" fill="url(#earth)"/>
  <line x1="70" y1="640" x2="774" y2="640" stroke="#cfc6b4" stroke-width="2"/>

  <!-- feature floor (spec, in progress) -->
  <rect x="80" y="330" width="684" height="34" rx="8" fill="#f1e8fb" stroke="#7b3fbf" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="80" y="330" width="684" height="34" rx="8" fill="url(#hatch)"/>
  <text x="96" y="352" class="lbl" fill="#7b3fbf">SPC · feature</text>
  <text x="208" y="352" class="note" fill="#7b3fbf">in progress: waits until the assumption below is tested</text>

  <!-- columns between skeleton and feature floor -->
  <rect x="128" y="364" width="44" height="76" fill="#ece4f6"/>
  <rect x="264" y="364" width="44" height="76" fill="#ece4f6"/>

  <!-- skeleton floor (spec, ready) -->
  <rect x="80" y="440" width="276" height="34" rx="8" fill="#7b3fbf"/>
  <text x="96" y="462" class="lbl white">SPC · walking skeleton</text>
  <text x="292" y="462" class="small white" fill="#ffffff" fill-opacity="0.85">ready</text>
  <g transform="translate(80,440)"><circle r="14" fill="#1d1d1b"/><text y="5" text-anchor="middle" class="num">5</text></g>

  <!-- pillars: requirements -->
  <!-- P1 active -->
  <rect x="128" y="474" width="44" height="166" fill="#3d5afe"/>
  <text transform="translate(155,557) rotate(-90)" text-anchor="middle" class="lbl white">REQ · active</text>
  <!-- P2 active -->
  <rect x="264" y="474" width="44" height="166" fill="#3d5afe"/>
  <text transform="translate(291,557) rotate(-90)" text-anchor="middle" class="lbl white">REQ · active</text>
  <!-- P3 provisional -->
  <rect x="400" y="364" width="44" height="276" fill="#fbf0dc" stroke="#c27c0e" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text transform="translate(427,502) rotate(-90)" text-anchor="middle" class="lbl" fill="#a2660a">REQ · provisional</text>
  <!-- P4 broken: leaning, cracked, not carrying anything -->
  <g transform="rotate(9 558 640)">
    <rect x="536" y="452" width="44" height="188" fill="#fbe4e4" stroke="#c62828" stroke-width="2.5"/>
    <polyline points="546,462 560,476 548,490 566,506 554,520" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linejoin="round"/>
    <text transform="translate(563,626) rotate(-90)" text-anchor="start" class="lbl" fill="#c62828">REQ · broken</text>
  </g>
  <!-- P5 active -->
  <rect x="672" y="364" width="44" height="276" fill="#3d5afe"/>
  <text transform="translate(699,502) rotate(-90)" text-anchor="middle" class="lbl white">REQ · active</text>

  <!-- foundation: facts and assumptions -->
  <g>
    <rect x="90" y="648" width="120" height="56" rx="8" fill="#1b8a5a"/>
    <text x="150" y="672" text-anchor="middle" class="lbl white">FCT ✓</text>
    <text x="150" y="692" text-anchor="middle" class="small" fill="#ffffff" fill-opacity="0.85">fact</text>

    <rect x="226" y="648" width="120" height="56" rx="8" fill="#1b8a5a"/>
    <text x="286" y="672" text-anchor="middle" class="lbl white">FCT ✓</text>
    <text x="286" y="692" text-anchor="middle" class="small" fill="#ffffff" fill-opacity="0.85">fact</text>

    <rect x="362" y="648" width="120" height="56" rx="8" fill="#fbf0dc" stroke="#c27c0e" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="422" y="672" text-anchor="middle" class="lbl" fill="#a2660a">ASM ?</text>
    <text x="422" y="692" text-anchor="middle" class="small" fill="#a2660a">untested</text>

    <rect x="498" y="648" width="120" height="56" rx="8" fill="#c62828"/>
    <polyline points="540,648 552,668 544,682 560,704" fill="none" stroke="#fbe4e4" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="582" y="672" text-anchor="middle" class="lbl white">ASM ✗</text>
    <text x="582" y="692" text-anchor="middle" class="small" fill="#ffffff" fill-opacity="0.85">refuted</text>

    <rect x="634" y="648" width="120" height="56" rx="8" fill="#1b8a5a"/>
    <text x="694" y="672" text-anchor="middle" class="lbl white">FCT ✓</text>
    <text x="694" y="692" text-anchor="middle" class="small" fill="#ffffff" fill-opacity="0.85">fact</text>
  </g>
  <g transform="translate(76,648)"><circle r="14" fill="#1d1d1b"/><text y="5" text-anchor="middle" class="num">1</text></g>

  <!-- promotion: test an assumption, it becomes a fact -->
  <path d="M422,708 C422,742 286,742 286,712" fill="none" stroke="#1b8a5a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="354" y="760" text-anchor="middle" class="note" fill="#1b8a5a">test it → it becomes a fact</text>

  <!-- 3 · render: records to many formats -->
  <path d="M774,346 L812,384" fill="none" stroke="#1d1d1b" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <polygon points="862,372 920,198 1140,198 1140,520 920,520 862,408" fill="url(#beam)"/>
  <circle cx="838" cy="390" r="30" fill="#1d1d1b"/>
  <text x="838" y="395" text-anchor="middle" class="lbl white">render</text>
  <g transform="translate(862,362)"><circle r="14" fill="#1d1d1b"/><text y="5" text-anchor="middle" class="num">3</text></g>

  <g font-size="15">
    <g transform="translate(920,198)">
      <path d="M0,10 a10,10 0 0 1 10,-10 h178 l22,22 v60 a10,10 0 0 1 -10,10 h-190 a10,10 0 0 1 -10,-10 z" fill="#ffffff" stroke="#e3e2dd" stroke-width="2"/>
      <path d="M188,0 v22 h22" fill="#f0efeb" stroke="#e3e2dd" stroke-width="2"/>
      <text x="16" y="28" class="lt">OpenSpec</text>
      <rect x="16" y="42" width="150" height="6" rx="3" fill="#e3e2dd"/><rect x="16" y="56" width="120" height="6" rx="3" fill="#e3e2dd"/><rect x="16" y="70" width="136" height="6" rx="3" fill="#e3e2dd"/>
    </g>
    <g transform="translate(920,312)">
      <path d="M0,10 a10,10 0 0 1 10,-10 h178 l22,22 v60 a10,10 0 0 1 -10,10 h-190 a10,10 0 0 1 -10,-10 z" fill="#ffffff" stroke="#e3e2dd" stroke-width="2"/>
      <path d="M188,0 v22 h22" fill="#f0efeb" stroke="#e3e2dd" stroke-width="2"/>
      <text x="16" y="28" class="lt">Spec Kit</text>
      <rect x="16" y="42" width="140" height="6" rx="3" fill="#e3e2dd"/><rect x="16" y="56" width="160" height="6" rx="3" fill="#e3e2dd"/><rect x="16" y="70" width="110" height="6" rx="3" fill="#e3e2dd"/>
    </g>
    <g transform="translate(920,426)">
      <path d="M0,10 a10,10 0 0 1 10,-10 h178 l22,22 v60 a10,10 0 0 1 -10,10 h-190 a10,10 0 0 1 -10,-10 z" fill="#ffffff" stroke="#e3e2dd" stroke-width="2"/>
      <path d="M188,0 v22 h22" fill="#f0efeb" stroke="#e3e2dd" stroke-width="2"/>
      <text x="16" y="28" class="lt">Gherkin</text>
      <text x="16" y="50" class="mono" font-size="12" fill="#6b6b66">Given … When …</text>
      <text x="16" y="68" class="mono" font-size="12" fill="#6b6b66">Then …</text>
    </g>
  </g>
  <text x="1030" y="546" text-anchor="middle" class="note">same records, many views</text>

  <!-- 4 · stack profile, plugged in at render time only -->
  <g transform="translate(900,590)">
    <rect width="240" height="104" rx="12" fill="#ffffff" stroke="#9c9b95" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="18" y="30" class="lt">Stack profile</text>
    <!-- database -->
    <g transform="translate(22,48)" fill="none" stroke="#6b6b66" stroke-width="2">
      <ellipse cx="14" cy="5" rx="14" ry="5"/>
      <path d="M0,5 v24 a14,5 0 0 0 28,0 v-24"/>
      <path d="M0,17 a14,5 0 0 0 28,0"/>
    </g>
    <!-- framework (layers) -->
    <g transform="translate(66,50)" fill="none" stroke="#6b6b66" stroke-width="2" stroke-linejoin="round">
      <path d="M15,0 L30,8 L15,16 L0,8 z"/>
      <path d="M0,16 L15,24 L30,16"/>
    </g>
    <!-- protocol (plug) -->
    <g transform="translate(112,50)" fill="none" stroke="#6b6b66" stroke-width="2" stroke-linecap="round">
      <rect x="2" y="8" width="22" height="16" rx="4"/>
      <line x1="8" y1="0" x2="8" y2="8"/><line x1="18" y1="0" x2="18" y2="8"/><line x1="13" y1="24" x2="13" y2="32"/>
    </g>
    <text x="150" y="64" class="small">databases,</text>
    <text x="150" y="80" class="small">frameworks,</text>
    <text x="150" y="96" class="small">protocols</text>
    <circle r="14" fill="#1d1d1b"/><text y="5" text-anchor="middle" class="num">4</text>
  </g>
  <path d="M900,640 C840,640 838,520 838,424" fill="none" stroke="#6b6b66" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="1020" y="722" text-anchor="middle" class="note">technology plugs in at render time,</text>
  <text x="1020" y="740" text-anchor="middle" class="note">never in the spec</text>

  <!-- divider -->
  <line x1="60" y1="790" x2="1140" y2="790" stroke="#e3e2dd" stroke-width="2"/>

  <!-- legend -->
  <g transform="translate(60,818)">
    <circle cx="13" cy="13" r="13" fill="#1d1d1b"/><text x="13" y="18" text-anchor="middle" class="num">1</text>
    <text x="34" y="18" class="lt">Facts vs. assumptions</text>
    <text x="0" y="46" class="ld">Requirements stand on facts.</text>
    <text x="0" y="64" class="ld">On untested ground: provisional.</text>
    <text x="0" y="82" class="ld">On refuted ground: broken.</text>
  </g>
  <g transform="translate(286,818)">
    <circle cx="13" cy="13" r="13" fill="#1d1d1b"/><text x="13" y="18" text-anchor="middle" class="num">2</text>
    <text x="34" y="18" class="lt">Atomic records</text>
    <text x="0" y="46" class="ld">One small file per fact, assumption,</text>
    <text x="0" y="64" class="ld">requirement or spec, linked by ID.</text>
    <text x="0" y="82" class="ld">Clean diffs, no merge conflicts.</text>
  </g>
  <g transform="translate(512,818)">
    <circle cx="13" cy="13" r="13" fill="#1d1d1b"/><text x="13" y="18" text-anchor="middle" class="num">3</text>
    <text x="34" y="18" class="lt">Standard-agnostic</text>
    <text x="0" y="46" class="ld">The records are the source of truth.</text>
    <text x="0" y="64" class="ld">OpenSpec, Spec Kit and Gherkin</text>
    <text x="0" y="82" class="ld">are renderings of them.</text>
  </g>
  <g transform="translate(738,818)">
    <circle cx="13" cy="13" r="13" fill="#1d1d1b"/><text x="13" y="18" text-anchor="middle" class="num">4</text>
    <text x="34" y="18" class="lt">Tech-stack agnostic</text>
    <text x="0" y="46" class="ld">Specs say what, never with what.</text>
    <text x="0" y="64" class="ld">Technology is bound at render</text>
    <text x="0" y="82" class="ld">time, outside the records.</text>
  </g>
  <g transform="translate(964,818)">
    <circle cx="13" cy="13" r="13" fill="#1d1d1b"/><text x="13" y="18" text-anchor="middle" class="num">5</text>
    <text x="34" y="18" class="lt">Skeleton first</text>
    <text x="0" y="46" class="ld">Build the walking skeleton, then</text>
    <text x="0" y="64" class="ld">features on top. When a fact</text>
    <text x="0" y="82" class="ld">changes, rebuild upward.</text>
  </g>
</svg>
