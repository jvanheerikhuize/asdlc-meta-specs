<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
  <title id="t">Concept 2: a requirement stands on its ground</title>
  <desc id="d">Every requirement says because and points at the fact or assumption it rests on. Resting on a fact, it is active and ready to build. Resting on an assumption, it is provisional and waits until the assumption is tested.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b8a5a"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fbf"/></marker>
  </defs>
  <style>
    text { font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", Menlo, monospace; }
    text:not([fill]) { fill: #1d1d1b; }
    .h1 { font-size: 26px; font-weight: 700; }
    .sub { font-size: 16px; }
    .name { font-size: 24px; font-weight: 700; }
    .tag { font-size: 15px; }
    .cap { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .body { font-size: 15px; }
    .hint { font-size: 13px; }
    .foot { font-size: 16px; }
    .lbl { font-size: 15px; font-weight: 700; }
    .pill { font-size: 13px; font-weight: 700; }
    .sub:not([fill]), .hint:not([fill]) { fill: #6b6b66; }
    .tag:not([fill]) { fill: #4a4a45; }
    .cap:not([fill]) { fill: #9c9b95; }
  </style>
  <rect x="1" y="1" width="998" height="558" rx="24" fill="#fbfaf7" stroke="#e3e2dd" stroke-width="2"/>
  <text x="60" y="66" class="h1">A requirement stands on its ground</text>
  <text x="60" y="96" class="sub">It says “because” and points at what it rests on.</text>
  <g transform="translate(60,128)">
  <rect x="0" y="0" width="420" height="336" rx="16" fill="#fff" stroke="#1b8a5a" stroke-width="2"/>
  <rect x="28" y="28" width="364" height="106" rx="12" fill="#fff" stroke="#1b8a5a" stroke-width="2"/><text x="44" y="59" class="lbl" fill="#3d5afe">REQ-0001</text><rect x="306" y="41" width="72" height="26" rx="13.0" fill="#e3f3ea"/><text x="342.0" y="58.5" text-anchor="middle" class="pill" fill="#1b8a5a">active</text><text x="44" y="90" class="body">The system MUST reject links</text><text x="44" y="112" class="body">to records that do not exist.</text>
  <line x1="210" y1="134" x2="210" y2="214" stroke="#1b8a5a" stroke-width="3"/><text x="222" y="179.0" class="hint">because</text>
  <rect x="162" y="214" width="96" height="64" rx="10" fill="#1b8a5a"/><path d="M192.0,247.0 l12,12 l24,-26" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="276" y="240" class="lbl" fill="#1b8a5a">Fact</text>
  <text x="276" y="262" class="hint">FCT-0001</text>
  <text x="210" y="314" text-anchor="middle" class="lbl" fill="#1b8a5a">Rests on a fact: ready to build.</text>
  </g>
  <g transform="translate(520,128)">
  <rect x="0" y="0" width="420" height="336" rx="16" fill="#fff" stroke="#c27c0e" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="28" y="28" width="364" height="106" rx="12" fill="#fff" stroke="#c27c0e" stroke-width="2" stroke-dasharray="7 5"/><text x="44" y="59" class="lbl" fill="#3d5afe">REQ-0004</text><rect x="266" y="41" width="112" height="26" rx="13.0" fill="#fbf0dc"/><text x="322.0" y="58.5" text-anchor="middle" class="pill" fill="#a2660a">provisional</text><text x="44" y="90" class="body">Every requirement MUST carry</text><text x="44" y="112" class="body">at least one example.</text>
  <line x1="210" y1="134" x2="210" y2="214" stroke="#c27c0e" stroke-width="3" stroke-dasharray="6 5"/><text x="222" y="179.0" class="hint">because</text>
  <rect x="162" y="214" width="96" height="64" rx="10" fill="#fbf0dc" stroke="#c27c0e" stroke-width="2.5" stroke-dasharray="7 5"/><text x="210.0" y="258.0" text-anchor="middle" font-size="34" font-weight="700" fill="#c27c0e">?</text>
  <text x="276" y="240" class="lbl" fill="#a2660a">Assumption</text>
  <text x="276" y="262" class="hint">ASM-0002</text>
  <text x="210" y="314" text-anchor="middle" class="lbl" fill="#a2660a">Rests on a belief: on hold.</text>
  </g>
  <text x="500" y="516" text-anchor="middle" class="foot">A requirement is never more certain than what it rests on.</text>
</svg>
