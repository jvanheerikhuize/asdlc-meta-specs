<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d">
  <title id="t">Concept 5: one source, many views</title>
  <desc id="d">The records are written once and say what the system must do and why. A renderer turns them into views for each tool, such as OpenSpec, Spec Kit and Gherkin. Technology choices, the tech stack such as SQL, Vue, REST APIs, Azure, Azure DevOps and GitHub Copilot, are added at render time, never written into the records.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b8a5a"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fbf"/></marker>
  </defs>
  <style>
    text { font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", Menlo, monospace; }
    text:not([fill]) { fill: #1d1d1b; }
    .h1 { font-size: 26px; font-weight: 700; }
    .sub { font-size: 16px; }
    .name { font-size: 24px; font-weight: 700; }
    .tag { font-size: 15px; }
    .cap { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    .body { font-size: 15px; }
    .hint { font-size: 13px; }
    .foot { font-size: 16px; }
    .lbl { font-size: 15px; font-weight: 700; }
    .pill { font-size: 13px; font-weight: 700; }
    .sub:not([fill]), .hint:not([fill]) { fill: #6b6b66; }
    .tag:not([fill]) { fill: #4a4a45; }
    .cap:not([fill]) { fill: #9c9b95; }
  </style>
  <rect x="1" y="1" width="998" height="598" rx="24" fill="#fbfaf7" stroke="#e3e2dd" stroke-width="2"/>
  <text x="60" y="66" class="h1">One source, many views</text>
  <text x="60" y="96" class="sub">Write it once. Render it for whatever tool needs it.</text>
  <text x="60" y="152" class="cap">THE RECORDS</text>
  <rect x="60" y="168" width="220" height="110" rx="12" fill="#fff" stroke="#e3e2dd" stroke-width="2"/><text x="76" y="196" class="lbl">SPC-0001.md</text><rect x="74" y="208" width="220" height="110" rx="12" fill="#fff" stroke="#e3e2dd" stroke-width="2"/><text x="90" y="236" class="lbl">REQ-0001.md</text><rect x="88" y="248" width="220" height="110" rx="12" fill="#fff" stroke="#e3e2dd" stroke-width="2"/><text x="104" y="276" class="lbl">FCT-0001.md</text><rect x="104" y="296" width="150" height="6" rx="3" fill="#e3e2dd"/><rect x="104" y="310" width="120" height="6" rx="3" fill="#e3e2dd"/><rect x="104" y="324" width="136" height="6" rx="3" fill="#e3e2dd"/>
  <text x="60" y="396" class="hint">one source: what the system</text>
  <text x="60" y="416" class="hint">must do, and why</text>
  <line x1="310" y1="296" x2="392" y2="296" stroke="#6b6b66" stroke-width="2" marker-end="url(#a-ink)"/>
  <circle cx="446" cy="296" r="50" fill="#1d1d1b"/>
  <text x="446" y="302" text-anchor="middle" class="lbl" fill="#fff">render</text>
  <text x="660" y="128" class="cap">VIEWS FOR EACH TOOL</text>
  <rect x="660" y="140" width="280" height="84" rx="12" fill="#fff" stroke="#e3e2dd" stroke-width="2"/><text x="680" y="172" class="lbl">OpenSpec</text><rect x="680" y="190" width="200" height="6" rx="3" fill="#e3e2dd"/><rect x="680" y="204" width="150" height="6" rx="3" fill="#e3e2dd"/><line x1="498" y1="296" x2="652" y2="182" stroke="#6b6b66" stroke-width="2" marker-end="url(#a-ink)"/><rect x="660" y="244" width="280" height="84" rx="12" fill="#fff" stroke="#e3e2dd" stroke-width="2"/><text x="680" y="276" class="lbl">Spec Kit</text><rect x="680" y="294" width="200" height="6" rx="3" fill="#e3e2dd"/><rect x="680" y="308" width="150" height="6" rx="3" fill="#e3e2dd"/><line x1="498" y1="296" x2="652" y2="286" stroke="#6b6b66" stroke-width="2" marker-end="url(#a-ink)"/><rect x="660" y="348" width="280" height="84" rx="12" fill="#fff" stroke="#e3e2dd" stroke-width="2"/><text x="680" y="380" class="lbl">Gherkin</text><text x="680" y="408" class="hint">Given … When … Then</text><line x1="498" y1="296" x2="652" y2="390" stroke="#6b6b66" stroke-width="2" marker-end="url(#a-ink)"/>
  <rect x="336" y="392" width="220" height="118" rx="12" fill="#fff" stroke="#9c9b95" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="446" y="420" text-anchor="middle" class="lbl">tech stack</text>
  <text x="446" y="446" text-anchor="middle" class="hint">SQL · Vue · REST APIs</text>
  <text x="446" y="468" text-anchor="middle" class="hint">Azure · Azure DevOps</text>
  <text x="446" y="490" text-anchor="middle" class="hint">GitHub Copilot</text>
  <line x1="446" y1="390" x2="446" y2="354" stroke="#6b6b66" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a-ink)"/>
  <text x="572" y="456" class="hint">the technology you choose</text>
  <text x="572" y="476" class="hint">plugs in here, never in</text>
  <text x="572" y="496" class="hint">the records</text>
  <text x="500" y="556" text-anchor="middle" class="foot">The records say what. The views and the tech stack decide how.</text>
</svg>
